<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="csBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#004AE8" />
    </linearGradient>
    <filter id="csShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0066FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Embed authentic high-resolution CounterSync raster artwork with vector squircle fallback -->
